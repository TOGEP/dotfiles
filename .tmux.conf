##### Basic #####

# Faster key response
set -sg escape-time 0

# Mouse support (optional, handy for resizing panes)
set -g mouse on

# Forward terminal focus events to apps (for nvim FocusGained)
set -g focus-events on

# 256 color / truecolor
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Start numbering at 1 (optional)
set -g base-index 1
setw -g pane-base-index 1

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# Status line
set -g status-interval 3
set -g status-left-length 50
set -g status-right-length 150
set -g status-style "bg=#11111b,fg=#cdd6f4"
set -g status-left "#[fg=#89b4fa,bold] #S #[default]"
set -g status-right "#(task rc._forcecolor=off rc.color=off +ACTIVE 2>/dev/null | awk 'NR==4{print substr(\$0, index(\$0,\$2))}' | cut -c-40) | #{b:pane_current_path} | %H:%M"

# Key binds
# Reload tmux.conf
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Split panes (more ergonomic)
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Navigate panes (vim-like)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resize panes (repeatable)
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Quick layout cycling
bind-key Space next-layout

# Ctrl-q to open an AI agent popup in the current pane's directory.
# Keeps a persistent session named "q-popup" and attaches/creates as needed.
bind-key -n C-q display-popup -d "#{pane_current_path}" -w 80% -h 80% -E \
  "tmux new-session -A -s q-popup 'source ~/.zprofile && codex'"

# sesh
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# --- Toggle shared todo pane in current session ---
# t はデフォルトで時計なので消す
unbind t
# Prefix+t:
# - 現在 window の最左に todo pane をトグル
bind-key t run-shell "todo_file=\$HOME/Documents/Note/Kanban/work.md; wtarget=\$(tmux display-message -p '#{session_name}:#{window_index}'); todo_pane=\$(tmux show-options -w -t \"\$wtarget\" -qv @todo_pane_id || true); if [ -n \"\$todo_pane\" ] && tmux display-message -p -t \"\$todo_pane\" '#{pane_id}' >/dev/null 2>&1; then tmux kill-pane -t \"\$todo_pane\"; prev_layout=\$(tmux show-options -w -t \"\$wtarget\" -qv @todo_prev_layout || true); if [ -n \"\$prev_layout\" ]; then tmux select-layout -t \"\$wtarget\" \"\$prev_layout\" >/dev/null 2>&1 || true; fi; tmux set-option -w -t \"\$wtarget\" -u @todo_prev_layout; tmux set-option -w -t \"\$wtarget\" -u @todo_pane_id; exit 0; fi; prev_layout=\$(tmux display-message -p -t \"\$wtarget\" '#{window_layout}'); tmux set-option -w -t \"\$wtarget\" @todo_prev_layout \"\$prev_layout\"; new_pane=\$(tmux split-window -f -t \"\$wtarget\" -hb -p 25 -P -F '##{pane_id}' \"nvim \\\"\$todo_file\\\"\"); tmux set-option -w -t \"\$wtarget\" @todo_pane_id \"\$new_pane\""

##### Work integration #####
# Assumes you have ~/bin/work in PATH.
# Prefix+w: create/attach a work session using the current pane's directory.
bind-key w run-shell "work '#{pane_current_path}'"

##### Quality-of-life #####

# New windows/panes inherit current path
bind-key c new-window -c "#{pane_current_path}"

# Copy mode
setw -g mode-keys vi
if-shell -b '[ "$(uname)" = "Darwin" ]' {
  set -s copy-command "pbcopy"
  display "using pbcopy as copy-command"
}

# tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-pain-control'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
