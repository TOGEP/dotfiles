onboarding = false

[theme]
name = "terminal"

auto_switch = false
[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
detach = ""
reload_config = "prefix+shift+r"
workspace_picker = "prefix+w"
goto = "prefix+g"
new_tab = "prefix+c"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = ["prefix+v", "prefix+|"]
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"

[[keys.command]]
key = "prefix+q"
type = "popup"
command = "exec codex"
description = "open Codex"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "shell"
command = "exec ~/dotfiles/script/herdr-toggle-todo.sh"
description = "toggle todo side pane"

[ui]
sidebar_width = 22
sidebar_collapsed_mode = "hidden"

[ui.toast]
delivery = "off"
